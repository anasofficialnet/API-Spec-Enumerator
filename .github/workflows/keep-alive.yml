name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute idle sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render FastAPI Docs
        run: curl -s -I https://aase-backend.onrender.com/docs > /dev/null
