
openapi: 3.0.0
info:
  title: ReqRes API
  version: 1.0.0
paths:
  /api/users:
    get:
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
    post:
      summary: Create user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                job:
                  type: string
  /api/unknown:
    get:
      summary: Undocumented endpoint we didn't hit in HAR
